<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PROLAND - Bikfaya Drone Orthomosaic</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .title-box {
            background: white;
            padding: 7px 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

    // Orthomosaic geographic limits
    const bounds = L.latLngBounds(
        [33.912314946573012, 35.690088509999427],
        [33.914529213223517, 35.692908635637465]
    );

    // Create map
    const map = L.map('map', {
        minZoom: 16,
        maxZoom: 22
    });

    // OpenStreetMap background
    const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
        {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // PROLAND / Pix4D orthomosaic
    // Pix4D export uses TMS Y coordinates
    const orthomosaic = L.tileLayer(
        '{z}/{x}/{y}.png',
        {
            minZoom: 16,
            maxZoom: 22,
            tms: true,
            bounds: bounds,
            opacity: 1.0,
            attribution: 'PROLAND Drone Orthomosaic'
        }
    ).addTo(map);

    // Zoom directly to survey
    map.fitBounds(bounds);

    // Layer selector
    const baseMaps = {
        "OpenStreetMap": osm
    };

    const overlays = {
        "Drone Orthomosaic": orthomosaic
    };

    L.control.layers(baseMaps, overlays).addTo(map);

    // Scale bar
    L.control.scale({
        metric: true,
        imperial: false
    }).addTo(map);

    // PROLAND title
    const TitleControl = L.Control.extend({
        options: {
            position: 'topright'
        },

        onAdd: function () {
            const div = L.DomUtil.create('div', 'title-box');
            div.innerHTML =
                'PROLAND<br>' +
                '<span style="font-weight:normal;">Bikfaya - Abi Hayla Drone Orthomosaic</span>';
            return div;
        }
    });

    map.addControl(new TitleControl());

</script>

</body>
</html>
